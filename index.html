<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLSI-Ranking | Hardware Research Rankings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="header-top">
        <h1>VLSI-Ranking</h1>
        <button id="themeToggle" class="theme-btn" title="Toggle Theme">🌓</button>
      </div>
      <p>A metric-driven ranking of top institutes based on VLSI research and publications.</p>
    </div>
  </header>
  
  <main>
    <aside class="sidebar">
      <h3>Filters</h3>
      <div class="filter-group">
        <label>Search Institution / Faculty</label>
        <input type="text" id="searchInput" placeholder="e.g. Stanford">
      </div>
      
      <div class="filter-group">
        <h4>Sub-areas</h4>
        <label><input type="checkbox" class="area-filter" value="Circuits & VLSI Design" checked> Circuits & VLSI Design</label>
        <label><input type="checkbox" class="area-filter" value="EDA" checked> EDA</label>
        <label><input type="checkbox" class="area-filter" value="Computer Architecture" checked> Computer Architecture</label>
        <label><input type="checkbox" class="area-filter" value="Hardware Security" checked> Hardware Security</label>
      </div>
    </aside>
    
    <section class="content">
      <div id="rankings-tab">
        <table id="rankingTable">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Institution</th>
              <th>Trend</th>
              <th>Score (Geo Mean)</th>
            </tr>
          </thead>
          <tbody id="rankingBody">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>
  
  <footer>
    <p>Built by <a href="https://github.com/i-hate-apple" target="_blank" rel="noopener noreferrer">i-hate-apple</a>. Inspired by CSRankings.</p>
  </footer>

  <script src="assets/d3.v7.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
