<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeHateApple | Hardware Research Rankings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-container">
      <h1>WeHateApple</h1>
      <p>Rankings for the chips that actually ship.</p>
    </div>
  </header>
  
  <main>
    <aside class="sidebar">
      <h3>Filters</h3>
      <div class="filter-group">
        <label>Search Institution / Faculty</label>
        <input type="text" id="searchInput" placeholder="e.g. Stanford">
      </div>
      
      <div class="filter-group">
        <h4>Sub-areas</h4>
        <label><input type="checkbox" class="area-filter" value="Circuits & VLSI Design" checked> Circuits & VLSI Design</label>
        <label><input type="checkbox" class="area-filter" value="EDA" checked> EDA</label>
        <label><input type="checkbox" class="area-filter" value="Computer Architecture" checked> Computer Architecture</label>
        <label><input type="checkbox" class="area-filter" value="Hardware Security" checked> Hardware Security</label>
      </div>
    </aside>
    
    <section class="content">
      <div class="tabs">
        <button class="tab-btn active" data-tab="rankings">Rankings</button>
        <button class="tab-btn" data-tab="programs">Program Explorer</button>
      </div>
      
      <div id="rankings-tab" class="tab-content active">
        <table id="rankingTable">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Institution</th>
              <th>Trend</th>
              <th>Score (Geo Mean)</th>
            </tr>
          </thead>
          <tbody id="rankingBody">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
      
      <div id="programs-tab" class="tab-content">
        <div id="programsContainer" class="programs-grid">
            <!-- Populated via JS -->
        </div>
      </div>
    </section>
  </main>
  
  <footer>
    <p>Built by i-hate-apple. Open-source, community-maintained, inspired by CSRankings.</p>
  </footer>

  <script src="assets/d3.v7.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
